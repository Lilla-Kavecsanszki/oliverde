<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Something went wrong — Oliverde</title>
<style>
  body{
    margin:0; font-family:Georgia, 'Times New Roman', serif;
    background:#F7F4EC; color:#23221E;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:40px; box-sizing:border-box;
  }
  .box{max-width:480px; text-align:center;}
  p.eyebrow{
    font-family:Arial, sans-serif; font-size:11px; letter-spacing:0.16em;
    text-transform:uppercase; color:#6E6759; margin-bottom:14px;
  }
  h1{font-size:30px; font-weight:400; color:#232A17; margin:0 0 16px;}
  p.text{font-family:Arial, sans-serif; font-size:15px; color:#6E6759; line-height:1.7; margin-bottom:28px;}
  a.btn{
    display:inline-block; font-family:Arial, sans-serif; font-size:12px;
    letter-spacing:0.06em; text-transform:uppercase; font-weight:500;
    background:#47542C; color:#fff; text-decoration:none;
    padding:13px 26px; border-radius:2px;
  }
</style>
</head>
<body>
  <div class="box">
    <p class="eyebrow">500</p>
    <h1>Something went wrong on our end.</h1>
    <p class="text">We're already looking into it. Please try again in a few minutes, or reach out directly if it keeps happening.</p>
    <a class="btn" href="/">Return home</a>
  </div>
</body>
</html>
